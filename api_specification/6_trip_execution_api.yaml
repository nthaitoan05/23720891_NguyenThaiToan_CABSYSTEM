openapi: 3.0.3
info:
  title: CAB System API - Trip Execution
  description: Quản lý quá trình thực hiện chuyến xe từ lúc nhận chuyến đến khi hoàn thành (FR05, FR07, FR08).
  version: 1.0.0
servers:
  - url: https://api.cabsystem.local/v1
paths:
  /trips/{tripId}:
    get:
      summary: Theo dõi chuyến đi hiện hành
      tags: [Trip Execution]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: "Thông tin chuyến, ETA, trạng thái." }
  /trips/{tripId}/respond:
    post:
      summary: Tài xế phản hồi yêu cầu chuyến đi (Chấp nhận/Từ chối)
      tags: [Trip Execution]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [accept, reject] }
      responses:
        '200': { description: "Ghi nhận phản hồi thành công." }
  /trips/{tripId}/status:
    put:
      summary: Tài xế cập nhật trạng thái chuyến đi
      tags: [Trip Execution]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [arrived, in_progress, completed] }
      responses:
        '200': { description: "Cập nhật thành công." }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
