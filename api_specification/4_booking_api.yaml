openapi: 3.0.3
info:
  title: CAB System API - Booking
  description: API phục vụ chức năng tạo yêu cầu đặt xe của khách hàng (FR03, FR04).
  version: 1.0.0
servers:
  - url: https://api.cabsystem.local/v1
paths:
  /bookings:
    post:
      summary: Tạo yêu cầu đặt xe
      tags: [Booking]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_location: { type: string }
                destination: { type: string }
                vehicle_type: { type: string }
      responses:
        '201': 
          description: "Tạo yêu cầu thành công, hệ thống bắt đầu tìm tài xế."
        '400':
          description: "Thiếu thông tin địa điểm hoặc loại xe không hợp lệ."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
