openapi: 3.0.3
info:
  title: CAB System API - Rating & History
  description: Xem lịch sử chuyến đi và đánh giá tài xế (FR13, FR14).
  version: 1.0.0
servers:
  - url: https://api.cabsystem.local/v1
paths:
  /history/trips:
    get:
      summary: Khách hàng/Tài xế xem lịch sử các chuyến xe của mình
      tags: [History]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "Danh sách chuyến đi." }
  /ratings/trips/{tripId}:
    post:
      summary: Khách hàng đánh giá tài xế
      tags: [Rating]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '201': { description: "Đánh giá thành công." }
        '403': { description: "Chuyến đi chưa hoàn thành không được đánh giá." }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
